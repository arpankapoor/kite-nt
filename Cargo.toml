[package]
name = "kite-nt"
version = "0.2.0"
edition = "2024"
rust-version = "1.99.1"
description = "Kite Connect live data and execution adapter for NautilusTrader"
license = "MIT"
readme = "README.md"
repository = "https://github.com/arpankapoor/kite-nt"

[package.metadata.cargo-machete]
# Referenced by code generated by Nautilus's arrow_custom_data macro.
ignored = ["arrow"]

[features]
high-precision = [
  "nautilus-common/high-precision",
  "nautilus-execution/high-precision",
  "nautilus-model/high-precision",
  "nautilus-serialization/high-precision",
]

[dependencies]
nautilus-common = { version = "0.67.0", default-features = false, features = [
  "live",
] }
nautilus-core = { version = "0.67.0", default-features = false }
nautilus-execution = { version = "0.67.0", default-features = false }
nautilus-live = { version = "0.67.0", default-features = false }
nautilus-model = { version = "0.67.0", default-features = false }
nautilus-network = { version = "0.67.0", default-features = false }
nautilus-serialization = { version = "0.67.0", default-features = false, features = [
  "arrow",
] }

anyhow = { version = "1.0.104", default-features = false, features = ["std"] }
arrow = { version = "59.3.2", default-features = false }
async-trait = { version = "0.1.92", default-features = false }
bytes = { version = "1.12.1", default-features = false }
csv = { version = "1.4.0", default-features = false }
flume = { version = "0.12.0", default-features = false, features = ["async"] }
jiff = { version = "0.2.38", default-features = false, features = [
  "serde",
  "static",
  "std",
] }
rust_decimal = { version = "1.43.0", default-features = false, features = [
  "macros",
  "serde",
  "std",
] }
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
serde_json = { version = "1.0.154", default-features = false }
serde_urlencoded = { version = "0.7.1", default-features = false }
sha2 = { version = "0.11.1", default-features = false }
strum = { version = "0.28.0", default-features = false, features = ["derive"] }
thiserror = { version = "2.0.21", default-features = false }
tokio = { version = "1.54.1", default-features = false, features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "time",
] }
tokio-stream = { version = "0.1.19", default-features = false }
tracing = { version = "0.1.44", default-features = false }

[dev-dependencies]
nautilus-live = { version = "0.67.0", default-features = false, features = [
  "node",
] }
nautilus-model = { version = "0.67.0", default-features = false, features = [
  "test-support",
] }
tokio = { version = "1.54.1", default-features = false, features = ["rt"] }

[lints.rust]
unreachable_pub = "warn"
unused_qualifications = "warn"

[lints.clippy]
allow_attributes = "warn" # Prefer #[expect] over #[allow].
indexing_slicing = "warn"
mod_module_files = "warn"
